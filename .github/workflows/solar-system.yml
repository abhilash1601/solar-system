name: Solar System Workflow

on:
    workflow_dispatch: 
    push: 
        branches: 
            - main
            - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            nodejs_version: [18]
            operating_system: [ubuntu-latest]
            exclude:
              - nodejs_version: 18
                operating_system: macos-latest
        runs-on: ${{matrix.operating_system}}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node JS Version -${{matrix.nodejs_version}}
              uses: actions/Setup-node@v4
              with:
                node-version: ${{matrix.nodejs_version}}
            - name: Cache npm depedency
              uses: actions/cache@v4
              with:
                path: node_modules
                key: ${{runner.os}}-node-modules-${{hashFiles('package-lock.json')}}
            - name: Install Dependency
              run: npm install
            - name: Unit Testing
              id: nodejs-unit-test
              run: npm test
            - name: Archive Test Results
            # if: steps.nodejs-unit-test.outcome == 'success'
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: Mocha-Test-Result-${{matrix.operating_system}}-${{matrix.nodejs_version}}
                path: test-results.xml

    code-coverage:
        name: Code Coverege #r
        strategy:
          matrix:
            nodejs_version: [18]
            operating_system: [ubuntu-latest]
        runs-on: ${{matrix.operating_system}}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node JS Version -${{matrix.nodejs_version}}
              uses: actions/Setup-node@v4
              with:
                node-version: ${{matrix.nodejs_version}}
            
            - name: Cache npm depedency
              uses: actions/cache@v4
              with:
                path: node_modules
                key: ${{runner.os}}-node-modules-${{hashFiles('package-lock.json')}}

            - name: Install Dependency
              run: npm install
            - name: Check Code Coverege
              continue-on-error: true
              run: npm run coverage
            - name: Archive Test Results
              uses: actions/upload-artifact@v4
              with:
                name: Code-Coverege-Result-${{matrix.operating_system}}-${{matrix.nodejs_version}}
                path: coverage
                retention-days: 5

    Docker:
        name: Containerization
        needs: [unit-testing,code-coverage]
        strategy:
          matrix:
            nodejs_version: [18]
            operating_system: [ubuntu-latest]
        runs-on: ${{matrix.operating_system}}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
            - name: Docker Build for testing
              uses: docker/build-push-action@v4
              with:
                context: .
                push: false
                tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

            - name: Docker Image Test
              run: |
                 docker images
                 docker run --name solar-system-app -d \
                 -p 3000:3000 \
                 -e MONGO_URI=$MONGO_URI \
                 -e MONGO_USERNAME=$MONGO_USERNAME \
                 -e MONGO_PASSWORD=$MONGO_PASSWORD \
                 ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

                 export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
                 echo $IP

                 echo Testing Image URL using wget
                 wget -q -O - 127.0.0.1:3000/live | grep live

            